<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Contact</title>
  <link rel="stylesheet" href="css/contacts.css">
  <style>
    #success-message {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background-color: #d1fae5;
      color: #065f46;
      border-radius: 6px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Contact Me</h1>
  <p class="subtitle">Feel free to reach out for collaborations or opportunities.</p>

  <div class="grid-2">

    <div class="card contact-info">
      <h3>Get in Touch</h3>

      <p>
        <strong>Email:</strong><br>
        <a href="mailto:gdeaannelleg@gmail.com">gdeaannelleg@gmail.com</a>
      </p>

      <p>
        <strong>Phone:</strong><br>
        <a href="tel:+639514522903">09514522903</a>
      </p>

      <p>
        <strong>Location:</strong><br>
        <a href="https://www.google.com/maps?q=Camarines+Norte,+Philippines" target="_blank">
          Camarines Norte, Philippines
        </a>
      </p>
      <div class="social-icons float">
        <a href="https://github.com/Deanns/" target="_blank" class="icon github">
            <i class="fab fa-github"></i>
        </a>
        <a href="https://linkedin.com/in/deannelle-garbin-37b0a71a6" target="_blank" class="icon linkedin">
            <i class="fab fa-linkedin-in"></i>
        </a>
        <a href="mailto:gdeannelle@gmail.com" class="icon email">
            <i class="fas fa-envelope"></i>
        </a>
    </div>
    </div>

    
    <div class="card">
      <h3>Send a Message</h3>
      <form id="contact-form">
        <input type="text" name="user_name" placeholder="Your Name" required>
        <input type="email" name="user_email" placeholder="Your Email" required>
        <input type="text" name="subject" placeholder="Subject" required>
        <textarea name="message" placeholder="Message" required></textarea>
        <button type="submit" id="submit-btn">Send Message</button>
      </form>
      <div id="success-message">✅ Your message was sent successfully!</div>
    </div>

  </div>

</div>

<script src="https://kit.fontawesome.com/yourkit.js" crossorigin="anonymous"></script>

<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
  emailjs.init("fLBeeXraegItV9cnx"); 

  const form = document.getElementById("contact-form");
  const submitBtn = document.getElementById("submit-btn");
  const successMessage = document.getElementById("success-message");

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    emailjs.sendForm('service_sx455dd', 'template_7i4bvh7', this)
      .then(() => {
    
        successMessage.style.display = "block";

        form.reset();

        submitBtn.disabled = false;
        submitBtn.textContent = "Send Message";

        setTimeout(() => {
          successMessage.style.display = "none";
        }, 3000);
      })
      .catch((error) => {
        alert("Failed to send message: " + error.text);
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Message";
      });
  });
</script>

</body>
</html>
